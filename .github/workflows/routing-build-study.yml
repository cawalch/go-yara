name: Routing construction study

on:
  workflow_dispatch:
  push:
    branches: [research/routing-build]
    paths:
      - .github/workflows/routing-build-study.yml
      - experiments/witness/**
      - compiler/**
      - internal/wordmatch/**

permissions:
  contents: read

env:
  GOMAXPROCS: "2"
  GOAMD64: v1
  GOTOOLCHAIN: local

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.0"
          check-latest: false
          cache: false
      - name: Record sources and build both revisions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/old results/new
          {
            git rev-parse HEAD
            uname -a
            lscpu
            go version
            go env GOOS GOARCH GOAMD64 GOTOOLCHAIN
            printf 'GOMAXPROCS=%s\n' "$GOMAXPROCS"
          } > results/environment.txt
          [[ "$(go env GOOS)/$(go env GOARCH)" == linux/amd64 ]]
          [[ "$(go env GOVERSION)" == go1.26.0 ]]
          sha256sum -c experiments/witness/api-fixtures.sha256 > results/fixture-check.txt
          git worktree add --detach "$RUNNER_TEMP/routing-old" bf6c3e4af2ae8d7df70a305513caee32a6fecfbc
          cp -R experiments "$RUNNER_TEMP/routing-old/experiments"
          result_dir="$PWD/results"
          for revision in old new; do
            source_dir="$PWD"
            if [[ "$revision" == old ]]; then source_dir="$RUNNER_TEMP/routing-old"; fi
            (
              cd "$source_dir"
              git rev-parse HEAD > "$result_dir/$revision/revision.txt"
              { git rev-parse HEAD; tail -n +2 "$result_dir/environment.txt"; } > "$result_dir/$revision/environment.txt"
              cp "$result_dir/fixture-check.txt" "$result_dir/$revision/fixture-check.txt"
              find compiler internal/wordmatch experiments/witness -name '*.go' -type f -print0 | sort -z | xargs -0 sha256sum > "$result_dir/$revision/sources.sha256"
              go test ./... > "$result_dir/$revision/repository-tests.txt" 2>&1
              go test -race ./compiler ./internal/wordmatch > "$result_dir/$revision/race.txt" 2>&1
              go vet ./compiler ./internal/wordmatch > "$result_dir/$revision/vet.txt" 2>&1
              go test -c -tags=witnessstudy -o "$result_dir/$revision/api.test" ./experiments/witness > "$result_dir/$revision/build.txt" 2>&1
              sha256sum "$result_dir/$revision/api.test" > "$result_dir/$revision/binary.sha256"
              "$result_dir/$revision/api.test" -test.run '^TestBooleanRoutingAPIParity$' -test.count=1 -test.v > "$result_dir/$revision/parity.txt" 2>&1
            )
          done
      - name: Six paired startup and scan rounds
        shell: bash
        run: |
          set -euo pipefail
          for round in 1 2 3 4 5 6; do
            revisions='old new'
            export BOOLEAN_API_REVERSE=$(((round - 1) % 2))
            if [[ "$BOOLEAN_API_REVERSE" == 1 ]]; then revisions='new old'; fi
            printf 'round=%s revisions=%s reverse=%s start=%s\n' "$round" "$revisions" "$BOOLEAN_API_REVERSE" "$(date -u +%FT%TZ)" >> results/order.txt
            for revision in $revisions; do
              printf 'round=%s reverse=%s start=%s\n' "$round" "$BOOLEAN_API_REVERSE" "$(date -u +%FT%TZ)" >> "results/$revision/order.txt"
              binary="results/$revision/api.test"
              "$binary" -test.run '^$' -test.bench '^BenchmarkBooleanRoutingAPIFirstScanner$' -test.benchtime=1x -test.count=1 > "results/$revision/first-scanner-$round.txt" 2>&1
              "$binary" -test.run '^$' -test.bench '^BenchmarkBooleanRoutingAPIReusedScanner$' -test.benchtime=100x -test.count=1 > "results/$revision/reused-scanner-$round.txt" 2>&1
              "$binary" -test.run '^$' -test.bench '^BenchmarkBooleanRoutingAPI$' -test.benchtime=100ms -test.count=1 > "results/$revision/scan-$round.txt" 2>&1
              "$binary" -test.run '^$' -test.bench '^BenchmarkBooleanRoutingAPIPositive$' -test.benchtime=100ms -test.count=1 > "results/$revision/positive-$round.txt" 2>&1
            done
          done
      - name: Audit frozen gates
        if: always()
        run: |
          go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260825160852-19be9d8e6c70
          python3 experiments/witness/analyze_build.py results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: routing-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: error
          retention-days: 30
