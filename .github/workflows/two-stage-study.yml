name: Two-stage event filter study

on:
  push:
    branches: [perf/two-stage-study]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: "2"
      BASELINE_REF: fcd4e78754aeba52bc90d0cb36a2bc3e28bb7bf2
      BOUNDED_REF: 2d7eb76e2c96fb570673d413c0d9cfdd62ba0328
      STATE_REF: b98586c6860bf9f8e87563957c4fe98b6c5383b6
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.0"
          cache: false
      - name: Build, verify and measure variants
        run: bash .github/scripts/two-stage-study.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: two-stage-study-linux-amd64
          path: results/
          retention-days: 30
