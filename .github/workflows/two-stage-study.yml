name: Two-stage event filter study

on:
  push:
    branches: [perf/two-stage-study]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: "2"
      FULL_REF: c6e2e85f25f0ffaef30af6a0ddb163dba0e4999b
      ATOMS_REF: 525c8034d7f0557d601cf984d3ff27d79eada2b9
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.0"
          cache: false
      - name: Build, verify and measure variants
        run: bash .github/scripts/two-stage-study.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: two-stage-study-linux-amd64
          path: results/
          retention-days: 30
