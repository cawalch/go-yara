name: Two-stage event filter study

on:
  push:
    branches: [perf/two-stage-study]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: "2"
      FULL_REF: c9e2fcc2561558a151d838c4da1e48b5ae352a8e
      ATOMS_REF: 021ea02429228f1fae5c0d8f058351660d7e962d
      BOUNDED_REF: 2d7eb76e2c96fb570673d413c0d9cfdd62ba0328
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.0"
          cache: false
      - name: Build, verify and measure variants
        run: bash .github/scripts/two-stage-study.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: two-stage-study-linux-amd64
          path: results/
          retention-days: 30
