name: Event performance study

on:
  push:
    branches: [perf/event-study]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.0"
          cache: false
      - name: Build and measure paired variants
        run: bash .github/scripts/event-study.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: event-study-linux-amd64
          path: results/
          retention-days: 30
