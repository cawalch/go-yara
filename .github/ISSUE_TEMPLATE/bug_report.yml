name: Bug report
description: Report a reproducible bug or incorrect YARA behavior
title: "bug: <brief description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help reproduce and fix the bug.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Please share a minimal YARA rule and test input that reproduces the issue.
      render: yara
      placeholder: |
        rule test_case {
            strings:
                $a = "example"
            condition:
                $a
        }
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened (include error messages, panic traces, or incorrect match results)?
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version
      placeholder: e.g. go version go1.26.0 darwin/arm64
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and architecture
      placeholder: e.g. Linux x86_64, macOS arm64
    validations:
      required: false
